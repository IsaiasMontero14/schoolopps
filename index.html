<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Opps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #f4f1ea;
    --ink: #12110f;
    --mute: #6f6a60;
    --line: rgba(18, 17, 15, 0.14);
    --night: #0f0e0c;
    --night-ink: #f4f1ea;
    --night-mute: #a39d90;
    --night-line: rgba(244, 241, 234, 0.16);
    --gold: #e0a312;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
    --gutter: clamp(18px, 5vw, 72px);
  }

  /* Bloquear el scroll de la página por completo */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* Esto elimina las barras de desplazamiento */
    background-color: var(--paper);
    color: var(--ink);
    font-family: var(--display);
  }

  /* Contenedor principal ajustado al tamaño de la pantalla */
  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .main-container {
    width: 100%;
    max-width: 1200px;
    height: 100%;
    max-height: 800px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: var(--gutter);
    box-sizing: border-box;
  }
</style>
</head>
<body>

  <div class="main-container">
    <!-- Aquí va el contenido que quieres que permanezca fijo en pantalla -->
    <h1>School Opps</h1>
    <p>Contenido principal ajustado sin scroll.</p>
  </div>

</body>
</html>
